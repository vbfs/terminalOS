appId: dev.terminalos.app
productName: terminalOS
directories:
  output: dist
files:
  - build/**
  - electron/**
  - node_modules/**
mac:
  target: dmg
  arch:
    - x64
    - arm64
  category: public.app-category.developer-tools
  icon: build/icon.icns
win:
  target: nsis
  icon: build/icon.ico
linux:
  target: AppImage
  icon: build/icons
nativeRebuilder: node-pty
